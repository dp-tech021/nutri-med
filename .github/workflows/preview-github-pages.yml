name: Publicar prévia da landing no GitHub Pages

on:
  push:
    branches:
      - preview/landing-github-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nutri-med-pages-preview
  cancel-in-progress: true

jobs:
  build:
    name: Validar e compilar prévia
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch de prévia
        uses: actions/checkout@v4
      - name: Configurar Node do projeto
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências travadas
        run: npm ci --no-audit --no-fund
      - name: Validar tipos
        run: npm run typecheck
      - name: Executar testes
        run: npm test
      - name: Validar lint
        run: npm run lint
      - name: Gerar site estático
        run: npm run build
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Enviar arquivos estáticos
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
  deploy:
    name: Publicar prévia pública
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: nutri-med-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Implantar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
